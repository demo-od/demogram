<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <!-- Main Box with Rounded Corners in Monochrome -->
    <rect
            x="50"
            y="50"
            width="400"
            height="400"
            rx="80"
            ry="80"
            fill="#000000"
            stroke="#ffffff"
            stroke-width="14"
            stroke-opacity="0.8"
    />

    <!-- Perfectly Centered "DG" Typography -->
    <text
            x="250"
            y="250"
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-size="180"
            font-weight="800"
            fill="#ffffff"
            letter-spacing="-4"
            text-anchor="middle"
            dominant-baseline="central"
    >DG</text>
</svg>
